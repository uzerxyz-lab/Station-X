name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Create Fresh Flutter Project Structure
        run: |
          flutter create . --org com.stationx.app --project-name station_x --platforms=android
          rm -rf lib/*
          rm -rf pubspec.yaml

      - name: Move our Files to Project
        run: |
          # یہاں ہم اپنی فائلیں کاپی کر رہے ہیں جو آپ نے اپ لوڈ کی ہیں
          # لیکن چونکہ آپ نے main.dart کو lib/ میں رکھا ہے، ہم اسے چیک کریں گے
          ls -la lib/

      - name: Copy Custom Main and Pubspec
        run: |
          # گیتھب سے آپ کی بنائی ہوئی main.dart اور pubspec.yaml کو صحیح جگہ سیٹ کرنا
          # اگر main.dart پہلے سے lib میں ہے تو اسے رہنے دیں گے
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
